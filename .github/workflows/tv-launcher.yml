name: TV Launcher / Build APK

on:
  push:
    paths:
      - "tv-launcher/**"
      - ".github/workflows/tv-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Collect APK
        run: mkdir -p out && cp app/build/outputs/apk/debug/*.apk out/tv-home-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tv-home-debug-apk
          path: tv-launcher/out/tv-home-debug.apk
          retention-days: 30
          if-no-files-found: error

[versions]
android-plugin = "9.5.0"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "36"
java-jdk = "21"
androidx-core = "1.19.1"
androidx-webkit = "1.14.0"
androidx-tvprovider = "1.1.0"
kotlinx-coroutines = "1.10.2"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
androidx-tvprovider = { module = "androidx.tvprovider:tvprovider", version.ref = "androidx-tvprovider" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

[plugins]
android-app = { id = "com.android.application", version.ref = "android-plugin" }
